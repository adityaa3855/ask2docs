<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG AI Assistant</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<!-- Toast Container -->
<div id="toastContainer" class="toast-container"></div>

<!-- Drag & Drop Overlay -->
<div id="dragOverlay" class="drag-overlay hidden">
    <div class="drag-content">
        <svg viewBox="0 0 24 24" width="48" height="48" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
        </svg>
        <h2>Drop documents here to upload</h2>
    </div>
</div>

<div class="app">

    <!-- Mobile Overlay -->
    <div class="mobile-overlay" id="mobileOverlay"></div>

    <!-- ================= Sidebar ================= -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h2>📂 Documents</h2>
            <!-- Close button for mobile -->
            <button class="close-sidebar-btn" id="closeSidebarBtn">✕</button>
        </div>

        <div id="documentList">
            <!-- Document items will be injected here -->
        </div>

        <div class="sidebar-footer">
            <label for="fileInput" class="upload-btn">
                <span class="upload-icon-small">📤</span> Upload Documents
            </label>
            <input type="file" id="fileInput" multiple hidden>
        </div>
    </aside>

    <!-- ================= Chat Area ================= -->
    <main class="chat-area">
        <!-- Header -->
        <div class="chat-header">
            <button class="hamburger-btn" id="hamburgerBtn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>
            </button>
            <div class="header-title">
                <h1>RAG AI Assistant</h1>
            </div>
        </div>

        <!-- Chat Container Wrapper for centering -->
        <div class="chat-scroll-wrapper" id="chatScrollWrapper">
            <div class="chat-container">
                <!-- Chat Box -->
                <div id="chatBox">
                    <!-- Empty State Welcome Screen -->
                    <div class="welcome-screen" id="welcomeScreen">
                        <div class="welcome-icon">✨</div>
                        <h2>How can I help you today?</h2>
                        <p>Ask questions from your uploaded documents or explore general knowledge.</p>
                    </div>
                </div>

                <!-- Loading Indicator -->
                <div id="loading" class="hidden">
                    <div class="spinner-container">
                        <svg class="spinner" viewBox="0 0 50 50">
                            <circle class="path" cx="25" cy="25" r="20" fill="none" stroke-width="5"></circle>
                        </svg>
                        <span id="loadingText">Processing...</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Input -->
        <div class="input-wrapper">
            <div class="input-container">
                <div class="input-area">
                    <!-- Upload -->
                    <label for="fileInput" class="upload-icon-label" title="Upload Document">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
                        </svg>
                    </label>
                    
                    <!-- Question -->
                    <textarea id="question" placeholder="Ask anything..." rows="1"></textarea>
                    
                    <!-- Send -->
                    <button id="askBtn" title="Send message">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                    </button>
                </div>
                <div class="input-footer">
                    AI can make mistakes. Verify important information.
                </div>
            </div>
        </div>
    </main>

</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
